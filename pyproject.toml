[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monitor-citas-dian"
version = "0.1.0"
description = "Consulta cada hora si hay citas en la DIAN y avisa para reservar a mano."
requires-python = ">=3.11"
dependencies = ["playwright>=1.48"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
monitor = "monitor_dian.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
